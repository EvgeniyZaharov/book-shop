spring:
  application:
    name: book-shop

  datasource:
    url: jdbc:postgresql://localhost:5433/bookshop
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cache:
    type: caffeine

logging:
  level:
    com.globus.book_shop: DEBUG